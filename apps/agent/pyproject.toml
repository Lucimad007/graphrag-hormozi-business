[project]
name = "agent"
version = "0.1.0"
description = "GraphRAG agent service (ingestion, retrieval, LangGraph, FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "neo4j>=6.3.1",
    "ontology",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pymupdf>=1.26.0",
    "pypdf>=6.19.0",
    "rapidocr-onnxruntime>=1.4.4",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ontology = { workspace = true }
