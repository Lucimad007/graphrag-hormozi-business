[project]
name = "agent"
version = "0.1.0"
description = "GraphRAG agent service (ingestion, retrieval, LangGraph, FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "neo4j>=6.3.1",
    "ontology",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pypdf>=6.19.0",
    "qdrant-client>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ontology = { workspace = true }
